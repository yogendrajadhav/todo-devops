apiVersion: apps/v1
kind: Deployment

metadata:
  name: todo-api

spec:
  replicas: 2

  selector:
    matchLabels:
      app: todo-api

  template:
    metadata:
      labels:
        app: todo-api

    spec:
      containers:
        - name: todo-api
          image: yogendrajadhav/todo-api:1.0
          imagePullPolicy: Always

          ports:
            - containerPort: 8080
