apiVersion: v1
kind: Service

metadata:
  name: {{ include "todo-api.fullname" . }}

spec:
  type: {{ .Values.service.type }}

  selector:
    {{- include "todo-api.selectorLabels" . | nindent 4 }}

  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      nodePort: {{ .Values.service.nodePort }}
